<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LunarLightMC 网络连接信息：Java 版与基岩版 IP。">
  <title>LunarLightMC · 网络</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch.png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast" class="toast">
    <span class="toast-icon">*</span>
    <span id="toastMsg">已复制到剪贴板</span>
  </div>

  <div class="container">
    <header class="header">
      <div class="logo-large">
        <img src="assets/favicon.png" alt="LunarLightMC 服务器图标">
        <div class="logo-name">LunarLightMC</div>
        <div class="logo-sub">点击线路即可复制地址</div>
      </div>
    </header>

    <nav class="tabs" aria-label="板块导航">
      <a class="tab-btn" href="index.html">主页</a>
      <a class="tab-btn active" href="network.html">网络</a>
      <a class="tab-btn" href="play.html">玩法</a>
      <a class="tab-btn" href="hardware.html">配置</a>
      <a class="tab-btn" href="rules.html">规则</a>
      <a class="tab-btn" href="links.html">链接</a>
    </nav>

    <div class="page-section">
      <div class="feature-card" style="border-color:#6d4c2a; margin-bottom:16px;">
        <h3>服务器信息</h3>
        <div class="server-info-header" id="serverInfoHeader">
          <img class="server-icon" id="serverIcon" src="assets/favicon.png" alt="服务器图标">
          <div class="server-info-text" id="serverInfoText">
            <div class="player-loading" style="padding:0;">正在获取服务器信息...</div>
          </div>
        </div>
      </div>

      <div class="feature-card" style="border-color:#6d4c2a; margin-bottom:16px;">
        <h3>Java 版线路（点击复制）</h3>
        <p>Java 版直接填写 IP，延迟越低连接越流畅。</p>
        <div id="networkList">
          <div style="text-align:center; color:#8a7a6a; padding:20px 0;">正在检测线路延迟...</div>
        </div>
      </div>

      <div class="feature-card" style="border-color:#4a6a8a;">
        <h3>基岩版线路（点击复制）</h3>
        <p>基岩版请填写地址与端口。IP：be.arclight.icu，端口：54188。</p>
        <div id="bedrockList">
          <div style="text-align:center; color:#8a7a6a; padding:20px 0;">正在检测基岩版线路...</div>
        </div>
      </div>
    </div>

    <div class="site-footer">LunarLightMC · LunarLight 管理组 &amp; 服务器所有</div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
